[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast tests with no network or API calls
    integration: Tests that call real APIs (need valid keys)
    smoke: End-to-end tests against a live server
    slow: Tests that take > 30 seconds

# Default: run unit tests only (fast, no network)
# To run all:       pytest tests/ -v
# To run smoke:     pytest tests/smoke/ -v
# To run integration: pytest tests/integration/ -v
addopts = --tb=short -q
