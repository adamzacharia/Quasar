# WebBench v0: web search quality benchmark for Quasar (UI-only).
#
# Every question is typed into the real UI (http://localhost:3001) by
# ui_webbench_run.py and graded from the saved screenshots and text against
# rubrics/<id>.md. API-harness numbers are not evidence for this bench.
#
# Fields
#   id          stable id (category prefix + number)
#   category    policy | transient | researcher | followup | no_search | images
#   subset      baseline = the 12 questions of the 2026-09-24 before/after run
#   web_toggle  state of the "Web Search" switch in the + menu when sending
#   expect_web  true = a good answer needs web evidence; false = web must NOT run
#   turns       one or more user turns sent in the same chat; the LAST turn is graded
#   rubric      grading file under rubrics/
#
# Phase 2 (2026-09-24) added policy 5, follow-ups 3 and images 3 (subset: phase2); the 12
# baseline ids are unchanged. New fields: official_domains (for the "official source cited
# first" side metric) and expect_images (images category).
version: 0.2
created: 2026-09-24
questions:
  - id: POL-01
    category: policy
    subset: baseline
    web_toggle: "on"
    expect_web: true
    official_domains: ["almascience.org", "almascience.nao.ac.jp", "almascience.eso.org", "almascience.nrao.edu", "almaobservatory.org"]
    turns:
      - "What is the proprietary period for ALMA Cycle 13 data?"
    rubric: rubrics/POL-01.md

  - id: POL-02
    category: policy
    subset: baseline
    web_toggle: "on"
    expect_web: true
