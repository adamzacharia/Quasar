name: Quasar CI

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Dummy keys for import checks (tests don't call real APIs)
      OPENAI_API_KEY: sk-test-dummy
      NASA_ADS_API_KEY: test-dummy
      DEFAULT_LLM_MODEL: gpt-4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-pro/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      # ── Lint ───────────────────────────────────────────────
      - name: Lint with ruff
        run: |
          ruff check --select E,F,W --ignore E501,E402 \
            services/issue_report_service.py \
            tests/unit/test_issue_report_service.py \
            tests/unit/test_request_scoped_model_state.py \
            tests/unit/test_tacc_history.py \
            tests/integration/test_live_provider_chat_protocol.py

      # ── Unit Tests ─────────────────────────────────────────
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -q

      - name: Run opt-in live provider smoke tests
        if: ${{ vars.RUN_LIVE_PROVIDER_TESTS == '1' }}
        env:
          RUN_LIVE_PROVIDER_TESTS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TACC_API_KEY: ${{ secrets.TACC_API_KEY }}
          TACC_BASE_URL: ${{ vars.TACC_BASE_URL }}
        run: |
          pytest tests/integration/test_live_provider_chat_protocol.py -v --tb=short

      # ── Import Smoke Test ──────────────────────────────────
      - name: Verify critical imports
        run: |
          python -c "
          print('Testing critical imports...')
          from config import settings
          print(f'  config.settings OK (model={settings.api.openai_model})')
          from services.vector_db import get_qdrant_client
          print('  services.vector_db OK')
          from services.rag_service import RAGService
          print('  services.rag_service OK')
          from integrations.ads_client import ADSService
          print('  integrations.ads_client OK')
          from integrations.datalink import DataLinkClient
          print('  integrations.datalink OK')
          from core.prompts.lit_to_code import LIT_TO_CODE_PROMPT
          assert len(LIT_TO_CODE_PROMPT) > 50, 'LIT_TO_CODE_PROMPT is empty!'
          print(f'  core.prompts.lit_to_code OK ({len(LIT_TO_CODE_PROMPT)} chars)')
          print('All critical imports passed ✅')
          "

      # ── Build Check ────────────────────────────────────────
      - name: Verify API server can start
        run: |
          cd ui-pro
          timeout 10 python -c "
          import sys; sys.path.insert(0, '..')
          from api.main import app
          print('FastAPI app created successfully ✅')
          "

      - name: Install frontend dependencies
        working-directory: ui-pro
        run: npm ci

      - name: Lint frontend
        working-directory: ui-pro
        run: npm run lint

      - name: Run frontend regression tests
        working-directory: ui-pro
        run: npm test

      - name: Build frontend
        working-directory: ui-pro
        run: npm run build
