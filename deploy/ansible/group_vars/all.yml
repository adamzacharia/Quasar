# Non-secret configuration for the Quasar VM deploy.
# Secrets (API keys, tokens) go in group_vars/vault.yml — see vault.yml.example.
---
quasar_user: quasar
quasar_root: /opt/quasar
quasar_app_dir: "{{ quasar_root }}/app"
quasar_venv: "{{ quasar_root }}/venv"

quasar_repo_url: "https://github.com/adamzacharia/Quasar.git"
# For a private repo over SSH instead:
#   quasar_repo_url: "git@github.com:adamzacharia/Quasar.git"
#   quasar_git_deploy_key_src: "~/keys/quasar_deploy_ed25519"   # path on YOUR machine
quasar_git_version: beta

# python3.12 exists as a package on both Ubuntu 24.04 and Rocky 9.
# Dev runs 3.13; requirements.txt handles both (legacy-cgi marker is 3.13-only).
quasar_python: python3.12
quasar_node_major: 22

quasar_backend_port: 8000
quasar_frontend_port: 3001

# Set false if the UI keeps living on Vercel and this VM is backend-only.
quasar_deploy_frontend: true

# Public domain (owned; currently points at Vercel). Cutover = A records for
# www + apex -> the TACC VM IP, then certbot. nginx answers on both names.
quasar_server_name: "www.quasarassistant.com quasarassistant.com"
# The origin browsers will use — canonical www host. Baked into the frontend at
# build time (NEXT_PUBLIC_API_URL) — same-origin /api calls through nginx, which
# also kills the Vercel<->Render cross-site cookie issue.
quasar_public_origin: "https://www.quasarassistant.com"

# SSE requirements from the TACC thread: buffering OFF, read timeout >= 600 s.
quasar_proxy_read_timeout: 3600
quasar_client_max_body_size: 200m

quasar_frontend_env:
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: "{{ quasar_public_origin }}"
  # NEXT_PUBLIC_ENABLE_EVAL_MODE intentionally unset in prod (compiled out).

# Non-secret backend .env entries. Merged with quasar_env_secrets from vault.yml;
# vault wins on key collisions.
quasar_env:
  QUASAR_ENV: production
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  ENABLE_SPECTRAL_LINE_EXPLORER: "1"
