<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090615"/>
      <stop offset="0.55" stop-color="#151026"/>
      <stop offset="1" stop-color="#352950"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a78ff"/>
      <stop offset="1" stop-color="#4f5eea"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#9a78ff"/>
    </marker>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="88" cy="130" r="2"/><circle cx="924" cy="92" r="3"/>
    <circle cx="788" cy="244" r="2"/><circle cx="173" cy="403" r="3"/>
    <circle cx="965" cy="509" r="2"/><circle cx="68" cy="772" r="2"/>
    <circle cx="853" cy="900" r="3"/><circle cx="202" cy="1148" r="2"/>
    <circle cx="976" cy="1290" r="3"/><circle cx="91" cy="1578" r="3"/>
    <circle cx="847" cy="1749" r="2"/><circle cx="410" cy="1814" r="2"/>
  </g>

  <image href="quasar_logo.png" x="414" y="95" width="252" height="252" preserveAspectRatio="xMidYMid meet" filter="url(#glow)"/>
  <text x="540" y="406" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="5">QUASAR</text>

  <rect x="110" y="506" width="860" height="216" rx="42" fill="#182644" stroke="#4f6489" stroke-width="3"/>
  <text x="540" y="575" text-anchor="middle" fill="#8fa6cc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="3">ASK A RESEARCH QUESTION</text>
  <text x="540" y="647" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="40">“What can ALMA tell us</text>
  <text x="540" y="698" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="40">about this object?”</text>

  <path d="M540 742 L540 870" stroke="#9a78ff" stroke-width="10" marker-end="url(#arrow)"/>

  <g transform="translate(140 912)">
    <rect width="800" height="510" rx="56" fill="#171126" stroke="#8b72d9" stroke-width="4"/>
    <text x="400" y="88" text-anchor="middle" fill="#bca8ff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="3">QUASAR CONNECTS THE STEPS</text>

    <g transform="translate(80 148)">
      <circle cx="90" cy="90" r="82" fill="#202f53"/>
      <path d="M35 104 Q90 48 145 104 M52 106 L40 150 M128 106 L140 150 M90 70 L90 148" fill="none" stroke="#a9c8ff" stroke-width="10" stroke-linecap="round"/>
      <text x="90" y="222" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">ARCHIVE</text>
    </g>

    <g transform="translate(310 148)">
      <circle cx="90" cy="90" r="82" fill="#202f53"/>
      <path d="M50 45 H126 V145 H50 Z M65 70 H111 M65 92 H111 M65 114 H100" fill="none" stroke="#d7b4ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="222" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">PAPERS</text>
    </g>

    <g transform="translate(540 148)">
      <circle cx="90" cy="90" r="82" fill="#202f53"/>
      <path d="M46 133 L76 98 L103 114 L137 57 M46 145 H140" fill="none" stroke="#ff8dcc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="222" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">ANALYSIS</text>
    </g>

    <text x="400" y="425" text-anchor="middle" fill="#aebbd1" font-family="Arial, Helvetica, sans-serif" font-size="34">Search • organize • explain</text>
  </g>

  <path d="M540 1450 L540 1568" stroke="#9a78ff" stroke-width="10" marker-end="url(#arrow)"/>

  <rect x="110" y="1610" width="860" height="190" rx="48" fill="url(#brand)"/>
  <text x="540" y="1688" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" letter-spacing="3">THE RESULT</text>
  <text x="540" y="1758" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">A transparent, reproducible</text>
  <text x="540" y="1808" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">research workflow</text>
</svg>
